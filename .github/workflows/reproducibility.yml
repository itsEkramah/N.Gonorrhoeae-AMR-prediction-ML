name: Reproducibility check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Validate notebook builder
        run: python -m py_compile build_reproducible_notebook.py

      - name: Execute notebook from a fresh kernel
        run: >-
          python -m jupyter nbconvert
          --to notebook
          --execute
          --output executed.ipynb
          --output-dir /tmp
          --ExecutePreprocessor.timeout=1200
          N_gonorrhoeae_AMR_reproducible_analysis.ipynb

      - name: Verify completion record
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          record = json.loads(Path("results/run_completion.json").read_text(encoding="utf-8"))
          if record.get("status") != "completed":
              raise SystemExit(f"Notebook did not complete: {record}")
          print(json.dumps(record, indent=2))
          PY
