<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Neisseria gonorrhoeae antimicrobial resistance prediction</title>
  <desc id="desc">A Bioinformatics Computing II semester project combining bacterial genomics and statistical learning.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#082F49"/>
      <stop offset="0.55" stop-color="#0F4C5C"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#A7F3D0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#001219" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <circle cx="1090" cy="28" r="150" fill="#FFFFFF" opacity="0.035"/>
  <circle cx="1145" cy="262" r="205" fill="#67E8F9" opacity="0.045"/>

  <g opacity="0.75" stroke="url(#accent)" stroke-width="4" fill="none">
    <path d="M930 38 C1005 76 1005 120 930 158 C855 196 855 240 930 278"/>
    <path d="M1080 38 C1005 76 1005 120 1080 158 C1155 196 1155 240 1080 278"/>
    <path d="M955 57 L1055 57 M925 98 L1085 98 M925 139 L1085 139 M925 180 L1085 180 M948 221 L1062 221 M975 262 L1035 262" opacity="0.7"/>
  </g>

  <g fill="#A7F3D0" opacity="0.65">
    <circle cx="884" cy="64" r="5"/><circle cx="1124" cy="104" r="5"/>
    <circle cx="874" cy="211" r="4"/><circle cx="1144" cy="235" r="4"/>
    <circle cx="835" cy="145" r="3"/><circle cx="1168" cy="63" r="3"/>
  </g>

  <g filter="url(#shadow)">
    <text x="64" y="80" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="2.2">BIOINFORMATICS COMPUTING II · SEMESTER PROJECT</text>
    <text x="64" y="137" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="700"><tspan font-style="italic">Neisseria gonorrhoeae</tspan> AMR</text>
    <text x="64" y="186" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="700">prediction from genomic unitigs</text>
    <rect x="64" y="218" width="640" height="2" fill="url(#accent)" opacity="0.85"/>
    <text x="64" y="258" fill="#D9F7F3" font-family="Segoe UI, Arial, sans-serif" font-size="22">Bacterial genomics  •  statistical learning  •  critical validation</text>
  </g>
</svg>
